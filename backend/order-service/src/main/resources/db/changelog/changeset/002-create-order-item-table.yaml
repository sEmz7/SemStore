databaseChangeLog:
  - changeSet:
      id: 002-create-order-items
      author: semyon
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: order_items
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: link
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: configuration
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(9,2)
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_order_items_order_id
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
            columns:
              - column:
                  name: order_id