services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped

  discovery-server:
    container_name: discovery-server
    build:
      context: .
      dockerfile: backend/discovery-server/Dockerfile.local
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 3s
      timeout: 2s
      retries: 20

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile.local
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GATEWAY_ORIGIN=http://localhost:8080
      - USER_SWAGGER_ORIGIN=http://localhost:8081
      - ORDERS_SWAGGER_ORIGIN=http://localhost:8082
      - FRONTEND_ORIGIN=http://localhost:3000

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile.local
    ports:
      - "8081:8081"
    depends_on:
      user-service-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${DATABASE_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - GATEWAY_ORIGIN=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 3s
      timeout: 2s
      retries: 20

  user-service-db:
    image: postgres:16.1
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres/user-service-db:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      timeout: 5s
      interval: 5s
      retries: 10

  order-service:
    container_name: order-service
    build:
      context: .
      dockerfile: backend/order-service/Dockerfile.local
    ports:
      - "8082:8082"
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${DATABASE_ORDER_SERVICE_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - GATEWAY_ORIGIN=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 3s
      timeout: 2s
      retries: 20

  order-service-db:
    container_name: order-service-db
    image: postgres:16.1
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres/order-service-db:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_ORDER_SERVICE_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      timeout: 5s
      interval: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - zookeeper

  notification-service:
    container_name: notification-service
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile.local
    ports:
      - "8083:8083"
    depends_on:
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8083/actuator/health" ]
      interval: 3s
      timeout: 2s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: senia
      CLICKHOUSE_PASSWORD: devpass
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./volumes/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user senia --password devpass --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  analytics-service:
    container_name: analytics-service
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    env_file:
      - analytics-service/.env
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy